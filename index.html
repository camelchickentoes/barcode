<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barcode Scanner</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>Barcode Scanner</h1>

    <div class="main">
      <div class="left">
        <div class="video-wrapper">
          <video id="video" playsinline></video>
          <div class="overlay"></div>
        </div>
        <div class="controls">
          <button id="start-btn" onclick="startScanner()">Start Scanner</button>
          <button id="stop-btn" onclick="stopScanner()" class="hidden">Stop Scanner</button>
        </div>
      </div>

      <div class="right">
        <div class="list-header">
          <span>Scanned IDs</span>
          <span class="count" id="count">0 scanned</span>
        </div>
        <div id="scan-list" class="scan-list">
          <p class="empty-msg">No scans yet...</p>
        </div>
      </div>
    </div>
  </div>

  <div class="info-icon" onclick="toggleInfoPopup()">ℹ</div>
  <div id="info-popup" class="info-popup hidden">
    <div class="info-content">
      <p>Made by Alexander Sierra i love u shelby</p>
      <a href="https://github.com/camelchickentoes/barcode" target="_blank" rel="noopener noreferrer">GitHub Repository</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
